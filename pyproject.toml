[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laerc"
version = "0.4.0"
description = "LAERC: layered reservoir + feed-forward language model with content-dependent readout of frozen reservoirs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Felix Köster"}]
dependencies = ["torch>=2.1", "numpy", "tqdm", "tiktoken", "tokenizers>=0.15"]

[project.optional-dependencies]
openwebtext = ["datasets>=2.0.0"]
hf = ["transformers>=4.40.0"]
plot = ["matplotlib"]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["laerc*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
